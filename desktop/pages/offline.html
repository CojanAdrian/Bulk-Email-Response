<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'" />
  <title>BulkPosting</title>
  <link rel="stylesheet" href="screen.css" />
</head>
<body>
  <main class="card">
    <img class="mark" src="../build/icon.png" alt="" />
    <p class="caps">Can't reach BulkPosting</p>
    <h1>No connection right now.</h1>
    <p class="lead">Check your internet connection. If it is fine, the address may be wrong: <b id="where"></b></p>
    <div class="row">
      <button id="retry" type="button">Try again</button>
      <button id="change" type="button" class="quiet">Change address</button>
    </div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
